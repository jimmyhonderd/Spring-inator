/* ---------- game ---------- */
let state='title', level=0, score=0, coins=0, lives=3, best=store.best||0, t_last=0, hintT=0, msgs=[], parts=[], shake=0, winT=0;
let map=[], rows=0, cols=0, hero, enemies=[], coinList=[], finish={x:0,y:0}, cam={x:0,y:0}, startPos={x:0,y:0}, deadT=0, levelT=0, boxes=[];
function loadLevel(n){
  const L=LEVELS[n%LEVELS.length].split('\n'); rows=L.length; cols=Math.max(...L.map(r=>r.length));
  map=L.map(r=>r.padEnd(cols,'.').split('')); enemies=[]; coinList=[]; boxes=[];
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){ const ch=map[y][x];
    if(ch==='P'){ startPos={x:x*T+1,y:y*T-2}; map[y][x]='.'; }
    if(ch==='F'){ finish={x:x*T,y:y*T}; map[y][x]='.'; }
    if(ch==='o'){ coinList.push({x:x*T+3,y:y*T+3,got:false}); map[y][x]='.'; }
    if(ch==='e'||ch==='E'||ch==='M'){ enemies.push({x:x*T+1,y:y*T+T-6,w:10,h:6,vx:ch==='e'?-0.35:ch==='E'?-0.55:-0.8,col:ch==='e'?'g':ch==='E'?'c':'m',alive:true,f:0}); map[y][x]='.'; }
  }
  hero={x:startPos.x,y:startPos.y,w:8,h:14,vx:0,vy:0,on:false,face:1,anim:0,jumpT:0,inv:0}; cam.x=0; cam.y=0; levelT=1500; deadT=0;
}
const solid=ch=>ch==='#'||ch==='='||ch==='?'||ch==='x';
function at(x,y){ const cx=Math.floor(x/T), cy=Math.floor(y/T); if(cx<0||cx>=cols) return '#'; if(cy<0) return '.'; if(cy>=rows) return '.'; return map[cy][cx]; }
function newGame(){ level=0; score=0; coins=0; lives=3; loadLevel(0); state='play'; hintT=5000; }
function msg(s,x,y,col){ msgs.push({s,x,y,l:900,col:col||P.ink}); }
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=0.3+Math.random()*1.2; parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.6,l:300+Math.random()*300,c:col}); } }
function die(){ if(deadT>0||hero.inv>0) return; lives--; deadT=1200; burst(hero.x+4,hero.y+7,P.yel,16); burst(hero.x+4,hero.y+7,P.red,10); shake=8; }

/* ---------- input ---------- */
const ptrs=new Map(); let keys={}, jumpQ=0, jumpHeld=false;
function fpos(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}; }
cv.parentElement.addEventListener('pointerdown',e=>{ const p=fpos(e); try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(state==='title'||state==='over'||state==='won'){ newGame(); return; } if(state==='pause'){ state='play'; return; }
  if(p.x>W-18&&p.y<18){ state='pause'; return; }
  if(ptrs.size>0){ jumpQ=120; jumpHeld=true; }
  ptrs.set(e.pointerId,{x0:p.x,y0:p.y,x:p.x,y:p.y,t0:performance.now(),moved:false,side:p.x<W/2?-1:1,jumped:ptrs.size>0});
});
cv.parentElement.addEventListener('pointermove',e=>{ const q=ptrs.get(e.pointerId); if(!q) return; const p=fpos(e); q.x=p.x; q.y=p.y;
  if(Math.hypot(p.x-q.x0,p.y-q.y0)>6) q.moved=true; if(!q.jumped && q.y0-p.y>22){ q.jumped=true; jumpQ=120; jumpHeld=true; } });
function endP(e){ const q=ptrs.get(e.pointerId); ptrs.delete(e.pointerId); jumpHeld=ptrs.size>0&&jumpHeld; if(!q) return;
  if(!q.moved && !q.jumped && performance.now()-q.t0<180){ jumpQ=120; } jumpHeld=false; }

addEventListener('keydown',e=>{ if(e.repeat) return; if(state==='title'||state==='over'||state==='won'){ if(e.key===' '||e.key==='Enter') newGame(); return; }
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){ state=state==='play'?'pause':'play'; return; } if(state==='pause'){ if(e.key===' '||e.key==='Enter') state='play'; return; }
  keys[e.key]=true; if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){ e.preventDefault(); jumpQ=120; jumpHeld=true; } });
addEventListener('keyup',e=>{ keys[e.key]=false; if(e.key===' '||e.key==='ArrowUp'||e.key==='w') jumpHeld=false; });

function moveDir(){ let d=0; if(keys.ArrowLeft||keys.a) d-=1; if(keys.ArrowRight||keys.d) d+=1;
  for(const q of ptrs.values()){ if(!q.jumped || q.moved) d+=q.side; } return Math.max(-1,Math.min(1,d)); }

/* ---------- update ---------- */
function update(dt){
  if(state!=='play') return;
  if(hintT>0) hintT-=dt; if(levelT>0) levelT-=dt;
  for(const m of msgs) m.l-=dt; msgs=msgs.filter(m=>m.l>0);
  for(const q of parts){ q.x+=q.vx*dt/16; q.y+=q.vy*dt/16; q.vy+=0.04*dt/16; q.l-=dt; } parts=parts.filter(q=>q.l>0);
  if(shake>0) shake-=dt*0.03; if(jumpQ>0) jumpQ-=dt; if(hero.inv>0) hero.inv-=dt;
  if(winT>0){ winT-=dt; if(winT<=0){ if(level+1>=LEVELS.length){ state='won'; best=Math.max(best,score); store.best=best; save(); } else { level++; loadLevel(level); } } return; }
  if(deadT>0){ deadT-=dt; if(deadT<=0){ if(lives<0){ state='over'; best=Math.max(best,score); store.best=best; save(); return; } hero.x=startPos.x; hero.y=startPos.y; hero.vx=0; hero.vy=0; hero.inv=1500; } return; }
  const h=hero, d=moveDir(), acc=0.012*dt, maxv=1.35;

  if(!h.on && jumpHeld && h.vy<0 && h.jumpT<150){ h.vy-=0.08*dt/16; h.jumpT+=dt; }
  h.vy=Math.min(3.2,h.vy+0.14*dt/16);

  let nx=h.x+h.vx*dt/16;
  if(h.vx>0){ if(solid(at(nx+h.w,h.y+1))||solid(at(nx+h.w,h.y+h.h-1))){ nx=Math.floor((nx+h.w)/T)*T-h.w-0.01; h.vx=0; } }
  else if(h.vx<0){ if(solid(at(nx,h.y+1))||solid(at(nx,h.y+h.h-1))){ nx=Math.floor(nx/T+1)*T+0.01; h.vx=0; } }
  h.x=Math.max(0,nx);

  if(h.vy>0){ if(solid(at(h.x+1,ny+h.h))||solid(at(h.x+h.w-1,ny+h.h))){ ny=Math.floor((ny+h.h)/T)*T-h.h; h.vy=0; h.on=true; } }
  else if(h.vy<0){ const tx1=h.x+1, tx2=h.x+h.w-1; let hit=false;
    for(const tx of [tx1,tx2]){ const ch=at(tx,ny); if(solid(ch)){ hit=true; const cx=Math.floor(tx/T), cy=Math.floor(ny/T); if(ch==='?'){ map[cy][cx]='x'; score+=50; coins++; msg('+50',cx*T+6,cy*T-4,P.yel); burst(cx*T+6,cy*T,P.yel,8); } } }
    if(hit){ ny=Math.floor(ny/T+1)*T+0.01; h.vy=0; } }
  h.y=ny;
  if(h.y>rows*T+20) die();
  h.anim+=Math.abs(h.vx)*dt*0.02;
  // coins
  for(const c of coinList){ if(c.got) continue; if(h.x<c.x+6&&h.x+h.w>c.x&&h.y<c.y+6&&h.y+h.h>c.y){ c.got=true; coins++; score+=10; burst(c.x+3,c.y+3,P.yel2,6); if(coins%20===0){ lives++; msg('LEVEN +1',h.x+4,h.y-8,P.green); } } }

    e.vy=Math.min(3.2,(e.vy||0)+0.14*dt/16); let ey=e.y+e.vy*dt/16; e.on=false;
    if(e.vy>0 && (solid(at(e.x+1,ey+e.h))||solid(at(e.x+e.w-1,ey+e.h)))){ ey=Math.floor((ey+e.h)/T)*T-e.h; e.vy=0; e.on=true; }

      if(h.vy>0 && h.y+h.h-e.y<6){ e.alive=false; score+=100; h.vy=-1.9; msg('+100',e.x+5,e.y-6,P.ink); burst(e.x+5,e.y+3,COL[e.col],10); }

}

/* ---------- draw ---------- */
function draw(t){

  ctx.fillStyle=P.bg; ctx.fillRect(0,0,W,H);

  for(let x=no-600;x<W;x+=600){ ctx.drawImage(near,x,skyY); for(const s of signs){ const sx=x+s.x; if(sx>-20&&sx<W+20) text('VWAB',sx,skyY+s.y,1,Math.sin(t*0.003+s.x)>-0.5?P.b4:P.b2,'c',0); } }
  ctx.save(); if(shake>0) ctx.translate((Math.random()*shake-shake/2)|0,(Math.random()*shake-shake/2)|0); ctx.translate(-cx,-cy);

  const cf=COIN[Math.floor(t/120)%4===3?1:Math.floor(t/120)%4===2?2:Math.floor(t/120)%4]; for(const c of coinList){ if(c.got) continue; ctx.drawImage(cf,c.x+3-cf.width/2|0,c.y); }
  // finish sign
  ctx.fillStyle=P.b4; ctx.fillRect(finish.x+5,finish.y-26,2,38); ctx.fillStyle=P.dark; ctx.fillRect(finish.x-6,finish.y-30,24,10); ctx.fillStyle=P.yel; ctx.fillRect(finish.x-6,finish.y-30,24,1); ctx.fillRect(finish.x-6,finish.y-21,24,1);
  text('VWAB',finish.x+6,finish.y-29,1,Math.sin(t*0.006)>0?P.yel:P.yel2,'c');
  for(const e of enemies){ if(!e.alive) continue; ctx.drawImage(ENEMY[e.col][Math.floor(e.f/180)&1],e.x|0,e.y|0); }
  if(deadT<=0 && (hero.inv<=0 || Math.floor(t/80)&1)){ const h=hero; let s=HERO.stand; if(!h.on) s=HERO.jump; else if(Math.abs(h.vx)>0.1) s=(Math.floor(h.anim)&1)?HERO.walk1:HERO.walk2;
    ctx.save(); ctx.translate((h.x|0)-1,(h.y|0)); if(h.face<0){ ctx.translate(10,0); ctx.scale(-1,1); } ctx.drawImage(s,0,0); ctx.restore(); }

  if(state==='pause'){ veil(); text('PAUZE',W/2,H*0.4,3,P.yel,'c'); text('TIK OM VERDER TE GAAN',W/2,H*0.4+26,1,P.ink,'c'); }

}
function hud(){ text('SCORE',4,3,1,P.ink,'l'); text(String(score).padStart(6,'0'),4,11,1,P.yel,'l');
  text('LEVEL '+(level+1),W/2,3,1,P.yel,'c'); text('BEST '+best,W/2,11,1,'rgba(255,255,255,.55)','c',0);
  text('×'+lives,W-14,3,1,P.ink,'r'); ctx.drawImage(HERO.stand,W-13,2,5,7); text('¤ '+coins,W-4,11,1,P.yel,'r');

function veil(){ ctx.fillStyle='rgba(5,8,18,.72)'; ctx.fillRect(0,0,W,H); }
function titleScreen(t){
  const skyY=H-far.height; ctx.drawImage(far,0,skyY); ctx.drawImage(near,-(t*0.01)%600,skyY); ctx.drawImage(near,600-(t*0.01)%600,skyY);
  const gy=H-14; for(let x=0;x<W;x+=T) ctx.drawImage(tile('#'),x,gy);
  const hx=W/2-5, hy=gy-14-Math.abs(Math.sin(t*0.004))*10; ctx.drawImage(Math.abs(Math.sin(t*0.004))>0.1?HERO.jump:HERO.stand,hx|0,hy|0);
  for(let i=0;i<3;i++){ ctx.drawImage(COIN[0],hx-30+i*10,gy-40+Math.sin(t*0.005+i)*3); }
  text('VWAB',W/2,H*0.14,3,P.b4,'c'); text('SPRING-INATOR',W/2,H*0.14+24,4,P.yel,'c'); text('VROEGER WAS ALLES BETER',W/2,H*0.14+60,1,P.cyan,'c');
  if(Math.sin(t*0.005)>0) text('TIK OM TE STARTEN',W/2,H*0.55,2,P.ink,'c');
  text('HOUD LINKS/RECHTS VAST = LOPEN',W/2,H*0.55+20,1,'rgba(255,255,255,.75)','c',0); text('TIK OF VEEG OMHOOG = SPRINGEN',W/2,H*0.55+30,1,'rgba(255,255,255,.75)','c',0);
  text('BEST '+best,W/2,H*0.55+44,1,P.yel,'c'); text('LEDJOCKEY',W/2,H-10,1,'rgba(255,255,255,.4)','c',0);
}
function frame(t){ const dt=Math.min(40,t-t_last||16); t_last=t; update(dt); draw(t); requestAnimationFrame(frame); }
fit(); loadLevel(0); requestAnimationFrame(frame);
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
